name: Salorie
options:
  bundleIdPrefix: com.salorie
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
schemes:
  Salorie:
    build:
      targets:
        Salorie: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalorieTests
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Salorie:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Salorie
    dependencies:
      - package: GRDB
    # Explicit Info.plist (generated by xcodegen) so we can declare the background-task
    # array keys that INFOPLIST_KEY_* can't express (plan §10 — background catalog refresh).
    info:
      path: Salorie/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Salorie uses the camera to scan barcodes and food labels."
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # Background App Refresh (BGAppRefreshTask) + CloudKit silent-push sync.
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.salorie.app.catalog-refresh]
        # Lets the OS launch us to accept a CKShare invite link (friend sharing).
        CKSharingSupported: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salorie.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # CloudKit (user-data sync + friend CKShare sharing). Container is
        # iCloud.com.salorie.app (see RemoteConfig.cloudKitContainerID). Set a real
        # DEVELOPMENT_TEAM above for device builds / to sign the iCloud entitlement.
        CODE_SIGN_ENTITLEMENTS: Salorie/Salorie.entitlements
  SalorieTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SalorieTests
    dependencies:
      - target: Salorie
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
